name: CD - Deploy to Databricks

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Check Databricks dev credentials
        id: check-dev-creds
        env:
          DATABRICKS_HOST_DEV: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN_DEV: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          if [ -z "$DATABRICKS_HOST_DEV" ] || [ -z "$DATABRICKS_TOKEN_DEV" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Databricks dev credentials are not configured; skipping deploy-dev."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy bundle to dev
        if: steps.check-dev-creds.outputs.ready == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: databricks bundle deploy -t dev

  deploy-prod:
    # only fires on version tags (v1.0.0, v1.1.0, ...) — this is the manual promotion gate.
    # Pair this with a GitHub Environment named "prod" that has required reviewers configured,
    # so a human has to click "approve" in the Actions UI before this job actually runs.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
        run: databricks bundle deploy -t prod
