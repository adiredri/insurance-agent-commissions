[project]
name = "commissions-pipeline"
version = "0.1.0"
description = "Lakehouse pipeline for insurance sales-agent commission and payment processing"
requires-python = ">=3.11"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.1.0",
    "faker==24.11.0",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "chispa==0.9.4",
    "ruff==0.4.2",
    "black==24.4.0",
    "pre-commit==3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
